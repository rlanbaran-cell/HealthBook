name: Build HealthBook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -o HealthBookAndroid_v1.4_clean.zip -d src
          find src -maxdepth 3 -type d

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          MGR=$(find $SDK -name sdkmanager -type f | head -1)
          yes | "$MGR" --licenses > /dev/null 2>&1 || true
          "$MGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Find project root
        id: findroot
        run: |
          R=$(find src -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          echo "dir=$R" >> $GITHUB_OUTPUT
          ls -la "$R"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "${{ steps.findroot.outputs.dir }}"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -f gradlew ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            sh gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Show APK
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HealthBook-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
