name: Build HealthBook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p src
          unzip -o HealthBookAndroid_v1.4_clean.zip -d src
          echo "---- ساختار فایل‌ها ----"
          find src -maxdepth 3 -type d
          echo "---- دنبال settings.gradle می‌گردیم ----"
          find src -name "settings.gradle*" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f | head -1)
          fi
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Find project root
        id: findroot
        run: |
          ROOT=$(find src -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)
          echo "root=$ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          ls -la "$ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      -- name: Build APK
  run: |
    cd "${{ steps.findroot.outputs.root }}"
    echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    if [ -f gradlew ]; then
      sed -i 's/\r$//' gradlew
      chmod +x gradlew
      sh gradlew :app:assembleDebug --stacktrace --no-daemon
    else
      gradle :app:assembleDebug --stacktrace --no-daemon
    fi

      - name: Show APK location
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HealthBook-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
